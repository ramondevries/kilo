# fail2ban filter for the Kilo Tracker security log (SECURITY_LOG_FILE, see the README).
# Install as /etc/fail2ban/filter.d/kilo-auth.conf.
#
# Matches sign-in abuse, as the app logs it:
#
#   2026-10-05 15:31:12 kilo-auth ip=203.0.113.9 event=code-wrong
#   2026-10-05 15:31:15 kilo-auth ip=203.0.113.9 event=removal-code-wrong
#   2026-10-05 15:31:20 kilo-auth ip=203.0.113.9 event=code-refused scope=address
#
# What is deliberately NOT matched:
#   event=code-would-refuse   the limits in RATELIMIT_MODE=log only say what they would do
#   scope=cooldown            a double click on "send code" is not abuse
#   scope=global              the site-wide cap trips for everybody; banning the visitors who
#                             run into it would punish the innocent
[Definition]
failregex = ^\s*kilo-auth ip=<ADDR> event=(?:code-wrong|removal-code-wrong)$
            ^\s*kilo-auth ip=<ADDR> event=code-refused scope=(?:address|removal|ip)$
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
ignoreregex =
