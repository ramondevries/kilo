# fail2ban filter for the Kilo Tracker security log (SECURITY_LOG_FILE, see the README).
# Install as /etc/fail2ban/filter.d/kilo-probe.conf.
#
# Kilo is a Flask app: it has no PHP, WordPress, phpMyAdmin, CGI or XML-RPC pages. A request for
# such a path is a scanner, so one is enough (jail kilo-probe). Example line:
#
#   2026-10-05 15:30:00 kilo-notfound ip=203.0.113.9 path=/wp-login.php
#
# Scanners send their whole list within seconds; counting unknown pages (kilo-notfound) bans them
# only after they are done. Requests for secrets such as /.env or /.git/config are better banned by
# a jail that reads all sites' access logs, because the same scanners sweep every site on a server.
# <ADDR> only matches a real address, and the percent-encoded path is last on the line, as in
# kilo-notfound.conf.
[Definition]
failregex = ^\s*kilo-notfound ip=<ADDR> path=(?i:\S*\.php\d?(?:[/?%%]\S*)?|/wp-\S*|/wordpress\S*|\S*/(?:phpmyadmin|pma|myadmin|cgi-bin|xmlrpc)\S*)$
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
ignoreregex =
