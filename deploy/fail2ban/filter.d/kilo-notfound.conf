# fail2ban filter for the Kilo Tracker security log (SECURITY_LOG_FILE, see the README).
# Install as /etc/fail2ban/filter.d/kilo-notfound.conf.
#
# Matches a request for a page that does not exist, as the app logs it:
#
#   2026-10-05 15:30:00 kilo-notfound ip=203.0.113.9 path=/.env
#
# <ADDR> only matches a real IPv4/IPv6 address, so the "ip=-" the app writes when it does not
# know the visitor's address can never be banned. The path is percent-encoded by the app (no
# spaces, no newlines) and last on the line, so a visitor cannot forge a second "ip=" in it.
[Definition]
failregex = ^\s*kilo-notfound ip=<ADDR> path=\S*$
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
ignoreregex =
