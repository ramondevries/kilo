{# Round back arrow for the top-left of a card title row. #}
{% macro back_link(href, label=_("Back")) %}
  <a class="back-link" href="{{ href }}" aria-label="{{ label }}" title="{{ _("Back") }}">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5"/>
      <path d="M11 6l-6 6 6 6"/>
    </svg>
  </a>
{% endmacro %}
